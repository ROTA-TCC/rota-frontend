<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <style>
        /* Reset básico e tipografia */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Container da página para centralizar o "app" */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        /* Div com dimensões de aplicativo mobile */
        .app-container {
            width: 375px;
            height: 812px; /* Proporção aproximada do iPhone X */
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* Sombra apenas para dar destaque na visualização no PC */
        }

        /* Cabeçalho Laranja */
        .header {
            background-color: #F69919;
            height: 110px; /* Espaçamento que abrange status bar + titulo */
            display: flex;
            align-items: flex-end; /* Alinha o texto mais perto da base do cabeçalho */
            padding: 20px;
        }

        .header-content {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .back-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #000;
        }

        /* Área do Conteúdo Principal */
        .content {
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        /* Card Cinza (Formulário) */
        .form-card {
            background-color: #D3D3D3;
            width: 100%;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 40px;
        }

        .form-card h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 25px;
            color: #000;
            font-weight: 700;
        }

        .form-card input {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            margin-bottom: 18px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        .form-card input::placeholder {
            color: #8C8C8C;
        }

        .form-card input:last-child {
            margin-bottom: 0;
        }

        /* Divisor "Ou" */
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 35px;
        }

        .divider::before, 
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #000;
        }

        .divider span {
            padding: 0 15px;
            font-size: 16px;
            font-weight: 500;
            color: #000;
        }

        /* Ícones Sociais */
        .social-icons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 5px;
            margin-bottom: 45px;
        }

        .social-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 1px solid #000;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .social-btn svg {
            width: 28px;
            height: 28px;
        }

        /* Botão "Concluir" */
        .btn-concluir {
            background-color: #D3D3D3;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            margin-bottom: 25px;
        }

        /* Link "Já tenho uma conta" */
        .login-link {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Container do App -->
    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="back-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                </div>
                <h1>Cadastro</h1>
            </div>
        </div>

        <!-- Conteúdo Principal -->
        <div class="content">
            
            <!-- Card de Formulário -->
            <div class="form-card">
                <h2>Bem Vindo!</h2>
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Senha">
            </div>

            <!-- Divisor -->
            <div class="divider">
                <span>Ou</span>
            </div>

            <!-- Botões Sociais -->
            <div class="social-icons">
                <!-- Google -->
                <button class="social-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </button>
                
                <!-- Facebook -->
                <button class="social-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="#1877F2" d="M17.5 3h-2.9C11.3 3 9 5.2 9 8.6V11H6v4h3v8h4v-8h3.3l.5-4H13V8.8c0-1.1.3-1.8 1.8-1.8h2.7V3z"/>
                    </svg>
                </button>

                <!-- Email -->
                <button class="social-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.5">
                        <rect x="2" y="5" width="20" height="14" rx="2" ry="2"/>
                        <path d="M2 7l10 6 10-6"/>
                    </svg>
                </button>

                <!-- Apple -->
                <button class="social-btn">
                    <svg viewBox="0 0 24 24">
                        <path fill="black" d="M17.05 20.28c-.98.95-2.05 1.8-3.08 1.8-1.08 0-1.5-.7-2.75-.7-1.25 0-1.78.7-2.78.7-1.05 0-2.15-.9-3.23-1.98C3 17.85 1.45 13.9 1.45 10.3c0-3.3 1.95-5.05 3.82-5.05 1.08 0 2.05.68 2.7.68.65 0 1.75-.7 3-.7 1.45 0 2.62.6 3.32 1.48-2.28 1.25-1.92 4.18.35 5.15-.65 1.6-1.58 3.12-2.75 4.3zM12.03 4.95c.5-1.45.05-2.95-1.05-3.95-1 .85-1.65 2.35-1.15 3.8.98.88 1.7.98 2.2.15z"/>
                    </svg>
                </button>
            </div>

            <!-- Botões Inferiores -->
            <button class="btn-concluir">Concluir</button>
            <a class="login-link">Já tenho uma conta</a>

        </div>
    </div>

</body>
</html>
