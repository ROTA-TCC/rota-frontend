<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava UI Clone</title>
    <style>
        /* Importando uma fonte que se aproxima do estilo moderno do app */
        @font-face {
            font-family: 'Eina03-SemiBold'; /* Nome que você vai usar para chamar a fonte */
            src: url('fontes/Eina03-SemiBold.ttf') format('truetype');
            font-weight: 600; /* SemiBold geralmente corresponde ao peso 600 */
            font-style: normal;
}

        :root {
            --bg-social: #262626;
            --text-continue: #D9D9D9;
            --btn-login: #FF743D;
            --text-black: #fff;
            --card-radius: 24px; /* Raio acentuado do card branco */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Eina03-SemiBold', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container no tamanho real de tela do iPhone 16 (Pro Max Aspect Ratio) */
        .iphone-screen {
            width: 393px; /* Largura padrão lógica de tela moderna */
            height: 852px;
            background-color: #fff;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Imagem Laranja Superior - Full Bleed até as bordas laterais e topo */
        .hero-image {
            width: 100%;
            height: 65%; /* Ocupa a parte superior */
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card Branco Inferior */
        .white-card {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%; /* Sobrepõe levemente a imagem para o efeito de curva */
            background-color: #0F0F0F;
            border-radius: var(--card-radius) var(--card-radius) 0 0;
            padding: 40px 24px 40px 24px;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .title {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Botão de Login Principal */
        .btn-login {
            background-color: var(--btn-login);
            color: #fff;
            border: none;
            height: 60px;
            padding: 24px 0;
            border-radius: 31px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 40px;
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .divider-text {
            color: var(--text-continue);
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 8px;
        }

        .social-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .social-box {
            width: 58px;
            height: 58px;
            background-color: var(--bg-social);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Estilo dos ícones (todos pretos #000000) */
        .social-box svg {
            width: 24px;
            height: 24px;
            fill: var(--text-black);
        }
    </style>
</head>
<body>

    <div class="iphone-screen">
        <!-- Parte da imagem laranja (vai até a borda) -->
        <div class="hero-image">
            <!-- A imagem de fundo cobrirá esta área -->
        </div>

        <!-- Card Branco com interações -->
        <div class="white-card">
            <h1 class="title">está a apenas alguns passos do Rota</h1>
            
            <button class="btn-login">Log In</button>

            <p class="divider-text">Ou continue com</p>

            <div class="social-container">
                <!-- Google -->
                <div class="social-box">
